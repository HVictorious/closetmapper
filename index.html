<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Closet Mapper</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("closetMapperTheme");if(t==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<style>
/* ===== Closet Mapper 2 — "night shift in the IDF": dark-first, cool steel surfaces, amber link-light accent ===== */
:root{
  --bg:#0c1218;--panel:#111a22;--raise:#17212b;--sunk:#0a0f14;--line:#223040;--line2:#2d3d50;
  --text:#d5dee7;--muted:#7d8ea0;--faint:#56677a;
  --accent:#f0a33a;--accent-ink:#1b1206;--accent-soft:rgba(240,163,58,.14);
  --ok:#3fc489;--bad:#f06460;--warn:#e9b949;--sel:#1b2a3a;
  --rack:#0b1015;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
:root[data-theme="light"]{
  --bg:#e9edf1;--panel:#ffffff;--raise:#f4f6f8;--sunk:#dde3e9;--line:#d3dae2;--line2:#bcc6d1;
  --text:#15202b;--muted:#5a6878;--faint:#8794a3;
  --accent:#c3740b;--accent-ink:#fff;--accent-soft:rgba(195,116,11,.12);
  --ok:#14915a;--bad:#c93a36;--warn:#a87805;--sel:#e3ebf3;--rack:#d6dde4;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:1px solid var(--line2);background:var(--raise);color:var(--text);border-radius:4px;padding:5px 11px;font:inherit;line-height:1.3}
button:hover{border-color:var(--faint);background:var(--sel)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.pri:hover{filter:brightness(1.08);background:var(--accent)}
button.dng{color:var(--bad)}
input,select,textarea{font:inherit;padding:5px 7px;border:1px solid var(--line2);border-radius:4px;background:var(--sunk);color:var(--text)}
code{font-family:var(--mono);background:var(--raise);border:1px solid var(--line);padding:0 4px;border-radius:3px;font-size:12px}
h2{margin:4px 0 8px;font-size:19px;font-weight:600;letter-spacing:-.01em}
h3{margin:16px 0 6px;font-size:15px;font-weight:600}
.muted{color:var(--muted)}
ul{margin:6px 0}
a{color:var(--accent)}

/* ---- shell ---- */
#shell{display:flex;min-height:100vh}
#side{width:256px;flex:none;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
body.sidehide #side{display:none}
#work{flex:1;min-width:0;display:flex;flex-direction:column}
#ctx{position:sticky;top:0;z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
#ctxTop{display:flex;align-items:center;gap:8px;padding:9px 18px 0}
#crumbs{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:2px;min-width:0;flex:1;overflow:hidden;white-space:nowrap}
#crumbs a{color:var(--muted);text-decoration:none;padding:2px 4px;border-radius:3px;cursor:pointer}
#crumbs a:hover{color:var(--text);background:var(--raise)}
#crumbs .sep{color:var(--faint);padding:0 1px}
#crumbs .here{color:var(--text);padding:2px 4px}
#tabs{display:flex;gap:2px;padding:6px 14px 0}
#tabs button{border:none;background:none;border-radius:0;padding:8px 12px 9px;white-space:nowrap;flex:none;color:var(--muted);font-weight:500;position:relative}
#tabs button:hover{color:var(--text);background:none}
#tabs button.on{color:var(--text)}
#tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.ib{padding:5px 9px;background:none;border-color:transparent;color:var(--muted)}
.ib:hover{color:var(--text);background:var(--raise);border-color:var(--line)}
#main{flex:1;padding:18px 22px 40px;min-width:0}
#appfoot{font-family:var(--mono);font-size:11px;color:var(--faint);padding:10px 14px}

/* ---- sidebar ---- */
.brand{display:flex;align-items:center;gap:9px;padding:14px 14px 10px}
.mclose{display:none;margin-left:auto}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand .mk{width:22px;height:22px;border-radius:4px;background:var(--sunk);border:1px solid var(--line2);display:grid;grid-template-rows:repeat(3,1fr);padding:3px;gap:2px}
.brand .mk i{background:var(--line2);border-radius:1px;position:relative}
.brand .mk i:nth-child(2)::after{content:"";position:absolute;right:1px;top:1px;width:3px;height:3px;border-radius:50%;background:var(--accent);box-shadow:0 0 4px var(--accent)}
.sideSec{padding:4px 10px}
.sideHead{display:flex;align-items:center;gap:6px;padding:8px 4px 6px;color:var(--muted);font-size:12px;font-weight:600}
.sideHead .sp{flex:1}
.sideHead button{padding:2px 8px;font-size:12px}
.fold{display:flex;align-items:center;gap:6px;width:100%;padding:8px 4px;border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;border-radius:4px;justify-content:flex-start}
.fold:hover{color:var(--text);background:none}
.fold .car{display:inline-block;transition:transform .15s;font-size:10px}
.fold[aria-expanded="true"] .car{transform:rotate(90deg)}
.loc{padding:5px 8px 5px 10px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;position:relative;font-size:13.5px}
.loc:hover{background:var(--raise)}
.loc.sel{background:var(--sel);color:var(--text);font-weight:600}
.loc.sel::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 6px var(--accent)}
.loc .x{opacity:0;color:var(--bad);font-size:12px;padding:0 3px}
.loc:hover .x{opacity:.8}
.loc.in{margin-left:12px}
.loc .n{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400}
.rk{display:flex;align-items:center;gap:7px;margin-left:24px;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:13px;color:var(--muted);border-left:1px solid var(--line2)}
.rk.in{margin-left:36px}
.rk:hover{color:var(--text);background:var(--raise)}
.rk.sel{color:var(--text);background:var(--sel)}
.rk .u{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}
.site{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 6px;margin-top:6px;border-radius:4px;font-weight:600;font-size:12.5px;cursor:pointer;user-select:none;color:var(--muted)}
.site:hover{color:var(--text);background:var(--raise)}
.site .act span,.loc .mv{opacity:0;cursor:pointer;font-size:11px;padding:0 3px;color:var(--muted)}
.site:hover .act span,.loc:hover .mv{opacity:.85}
.site .cnt{font-weight:400;color:var(--faint);font-family:var(--mono);font-size:11px}
.site.nosite{border:1px dashed var(--line2)}
.grip{color:var(--faint);font-size:11px;cursor:grab}
.loc.over,.site.over{outline:2px solid var(--accent);outline-offset:-2px}
.tplh{font-weight:600;margin-top:16px}
.tpl{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-left:4px solid #2563eb;border-radius:4px;padding:5px 8px;margin:4px 0;background:var(--raise);cursor:grab;user-select:none;font-size:13px}
.tpl:hover{border-color:var(--line2)}.tpl:active{cursor:grabbing}
.tpl small{margin-left:auto;color:var(--faint);font-size:11px;font-family:var(--mono)}
.sw{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:4px 0;color:var(--muted)}
.sw i{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.sideFoot{margin-top:auto;border-top:1px solid var(--line);padding:10px 14px 12px;font-size:12.5px}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
.led.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.led.warn{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.led.bad{background:var(--bad);box-shadow:0 0 6px var(--bad)}

/* ---- content ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.racks{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.rackbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
.rack{position:relative;width:240px;background:repeating-linear-gradient(#2a3644 0 21px,#121a22 21px 22px);border:4px solid #0b1015;margin-top:6px;border-radius:2px}
.dev{position:absolute;left:24px;right:2px;border:1px solid rgba(0,0,0,.6);border-radius:2px;color:#fff;font-size:12px;padding:1px 5px;overflow:hidden;cursor:pointer;white-space:nowrap}
.dev.switch{background:#2563eb}
.dev.patch{background:#d97706}
.slot{position:absolute;left:24px;right:2px;cursor:pointer;color:transparent;font-size:11px;padding-left:6px;border-radius:2px;white-space:nowrap;overflow:hidden}
.slot:hover{background:rgba(240,163,58,.3);color:#fff;outline:1px dashed var(--accent)}
.un{position:absolute;left:2px;width:20px;font-size:9px;color:#8b9aab;text-align:right;font-family:var(--mono)}
.ports{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.port{width:80px;border:1px solid var(--line2);border-radius:5px;background:var(--raise);padding:4px 3px;text-align:center;cursor:pointer;font-size:11px;min-height:56px;overflow:hidden;color:var(--text)}
.port.used{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.port:hover{border-color:var(--accent)}
.port b{display:block;font-size:13px;font-family:var(--mono)}
table{border-collapse:collapse;background:var(--panel);width:100%;margin-bottom:18px;border:1px solid var(--line);border-radius:6px}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;font-size:13px}
th{background:var(--raise);color:var(--muted);font-weight:600;font-size:12px}
tr:hover td{background:color-mix(in srgb,var(--raise) 60%,transparent)}
td input{width:100%;border:none;background:transparent;padding:2px}
td input:focus{background:var(--accent-soft);outline:1px solid var(--accent)}
#modal{position:fixed;inset:0;background:rgba(4,8,12,.6);display:none;align-items:center;justify-content:center;z-index:40;padding:12px}
#modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:18px;min-width:340px;max-width:92vw;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.45)}
#modal label{display:block;margin:10px 0 3px;font-size:12px;color:var(--muted)}
#modal input,#modal select,#modal textarea{width:100%}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--raise);color:var(--text);border:1px solid var(--line2);border-left:3px solid var(--ok);padding:9px 16px;border-radius:5px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;max-width:80vw;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{border-left-color:var(--bad)}
.ovl{position:fixed;inset:0;background:rgba(4,8,12,.82);display:flex;align-items:center;justify-content:center;padding:20px}
.ovl>.dlg{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:24px;max-width:540px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ovl>.dlg p{color:var(--muted)}
.menu{position:fixed;z-index:45;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.4);padding:4px;min-width:220px;font-size:13px}
.menu .mi{padding:6px 10px;border-radius:4px;cursor:pointer}
.menu .mi:hover{background:var(--sel)}
.menu .mh{padding:3px 10px;font-size:12px;color:var(--muted);font-family:var(--mono)}

/* ---- rack view ---- */
#rwrap{overflow:auto;height:calc(100vh - 230px);background:var(--sunk);border:1px solid var(--line);border-radius:6px;display:flex}
#rsvg{flex:none;margin:0 auto;display:block;font-family:var(--sans)}
#rsvg .cb,#rsvg .pt,#rsvg .dv{cursor:pointer}
#rsvg .cb{transition:opacity .12s}
#rsvg.dim .cb{opacity:.1}
#rsvg.dim .cb.hl{opacity:1}
#rsvg .cb.hl .vis{stroke-width:4.5}
#rsvg .pt.hp rect{stroke:#facc15;stroke-width:3}
#rvghost rect{stroke-dasharray:7 4}
#slottext{font-size:19px;font-weight:700;fill:#fff;stroke:#1d4ed8;stroke-width:4;paint-order:stroke;pointer-events:none}
#rsvg .dv{touch-action:none}
#rsvg .slot{cursor:pointer}
#rsvg .slot rect{fill:transparent;stroke:transparent}
#rsvg .slot text{fill:transparent;pointer-events:none}
#rsvg .slot:hover rect{fill:rgba(240,163,58,.18);stroke:var(--accent);stroke-dasharray:6 4}
#rsvg .slot:hover text{fill:var(--text)}
.ink{fill:var(--text)}
.dsvg{background:var(--panel);border:1px solid var(--line)}.dsvg .ink{fill:var(--text)}.dsvg .mut{fill:var(--muted)}

/* ---- search ---- */
#gs{position:relative;flex:0 1 300px}
#gs input{width:100%;background:var(--sunk);border-color:var(--line);padding-left:28px;font-size:13px}
#gs::before{content:"";position:absolute;left:10px;top:50%;width:9px;height:9px;border:1.5px solid var(--faint);border-radius:50%;transform:translateY(-62%)}
#gs::after{content:"";position:absolute;left:19px;top:58%;width:5px;height:1.5px;background:var(--faint);transform:rotate(45deg)}
#gsr{display:none;position:absolute;top:100%;right:0;margin-top:4px;width:440px;max-width:92vw;max-height:70vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.45);z-index:30}
#gsr .gh{padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted);background:var(--raise)}
#gsr .gi{padding:6px 10px;cursor:pointer;border-top:1px solid var(--line)}
#gsr .gi.sel,#gsr .gi:hover{background:var(--sel)}
#gsr .gi small{display:block;color:var(--muted);font-size:12px}
#gsr mark{background:var(--accent-soft);color:var(--accent);padding:0}
#gsr .gn{padding:10px;color:var(--muted)}


.tabsep{width:1px;background:var(--line);margin:8px 8px 10px}
.mono{font-family:var(--mono)}
.trace{display:flex;flex-direction:column}
.tn{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:5px;border:1px solid var(--line);background:var(--raise)}
.tn[data-go]{cursor:pointer}.tn[data-go]:hover{border-color:var(--accent)}
.tn i{width:10px;height:10px;border-radius:2px;margin-top:5px;flex:none}
.tn b{font-family:var(--mono);font-weight:500}
.tn small{display:block;color:var(--muted);font-size:12px}
.tn.room{border-style:dashed}.tn.room b{font-family:var(--sans);font-weight:600}
.tl{position:relative;height:26px;margin-left:12px;border-left:2px solid var(--line2);padding-left:12px;display:flex;align-items:center}
.tl span{font-size:11.5px;color:var(--muted)}
.tl.trunk{border-left:3px double var(--accent)}.tl.trunk span{color:var(--accent)}
.tl.hr,.tl.run{border-left-style:dotted}
.trace.compact .tn{padding:4px 7px}.trace.compact .tl{height:20px}
.roomgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start}
.roomcard{margin:0;display:flex;flex-direction:column;gap:8px}
.roomcard .rh{display:flex;gap:10px;align-items:flex-start}.roomcard .rh i{width:12px;height:12px;border-radius:3px;margin-top:5px;flex:none}
.roomcard .rh b{font-size:15px}.roomcard .rh small{display:block;color:var(--muted);font-size:12px}
.roomcard .rh .ib{margin-left:auto}
.roomcard .rc{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.roomcard .drop{border-top:1px solid var(--line);padding-top:8px}.roomcard .dl{font-size:11.5px;color:var(--muted);margin:0 0 4px}
.roomcard.cam{border-style:dashed}
.capsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0 6px}
.capsum .card{margin:0}.capsum .big{font-family:var(--mono);font-size:24px;font-weight:500;margin-top:2px}.capsum .big span{font-size:12px;font-family:var(--sans)}
.captab td{vertical-align:middle}
.captab tr.grp td{background:var(--raise);color:var(--muted);font-weight:600;font-size:12px}
.cap{min-width:150px}.cap .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-bottom:3px}.cap .bar i{display:block;height:100%}
.cap span{font-size:12.5px}.cap b{font-family:var(--mono);font-weight:500}
.hist{max-height:60vh;overflow:auto}
.he{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.he time{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none;width:150px}
.he ul{margin:0;padding-left:16px}

.roombox{display:block;text-align:left;width:100%;margin:0;cursor:pointer;font:inherit;color:var(--text);padding:12px 14px}
.roombox:hover{border-color:var(--accent);background:var(--panel)}
.roombox .rh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}.roombox .rh b{font-size:17px}.roombox .rh small{color:var(--muted)}
.roombox .rc{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.roombox ul{list-style:none;margin:0;padding:0}
.roombox li{display:flex;align-items:center;gap:8px;padding:3px 0;border-top:1px solid var(--line);font-size:13px}
.roombox li i{width:9px;height:9px;border-radius:2px;flex:none}
.roombox .dn{font-family:var(--mono);min-width:44px}.roombox .pe{color:var(--muted);font-family:var(--mono);font-size:12px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roombox li.th .dn{font-family:var(--sans)}
.warnbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-left:3px solid var(--warn)}

.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.phgrid figure{margin:0;background:var(--raise);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.phgrid img{display:block;width:100%;height:170px;object-fit:cover;cursor:zoom-in}
.phgrid .phmiss{height:170px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:var(--muted);font-size:12px}
.phgrid figcaption{display:flex;align-items:center;gap:6px;padding:6px;flex-wrap:wrap}.phgrid figcaption input{flex:1;min-width:0;font-size:12.5px;padding:3px 6px}
.phgrid figcaption small{width:100%;order:3}

.chip{border-radius:14px;padding:4px 12px}.chip.on{background:var(--sel);border-color:var(--accent);color:var(--text)}
.fpwrap{display:flex;gap:14px;align-items:flex-start;margin-top:8px}
.fpcanvas{position:relative;flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;background:#fff;user-select:none}
.fpcanvas img{display:block;width:100%;height:auto;border-radius:6px}
.fpcanvas.placing{cursor:crosshair;outline:2px dashed var(--accent);outline-offset:2px}
.pin{position:absolute;transform:translate(-50%,-100%);cursor:grab;touch-action:none}
.pin span{display:block;background:var(--accent);color:var(--accent-ink);font:600 12px var(--sans);padding:2px 7px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.4);white-space:nowrap}
.pin::after{content:"";display:block;width:2px;height:8px;margin:0 auto;background:var(--accent)}
.pin.sel span{outline:2px solid #fff}.pin.lost span{background:#8b93a0}
.pinpop{position:absolute;transform:translate(-50%,10px);z-index:5;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:10px 12px;min-width:200px;max-width:300px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:13px}
.pinpop ul{list-style:none;padding:0;margin:6px 0}.pinpop li{padding:2px 0}
.fpside{width:240px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:calc(100vh - 200px);overflow:auto}

<script>
// ============ Closet Mapper — app script ============
function boot(){
var KEY='closetMapper1';
var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
var S;try{S=JSON.parse(raw)||null}catch(e){S=null}
if(!S||typeof S!=='object')S={};
if(!Array.isArray(S.locations))S.locations=[];
if(!Array.isArray(S.racks))S.racks=[];
if(!Array.isArray(S.devices))S.devices=[];
if(!Array.isArray(S.ports))S.ports=[];
if(!Array.isArray(S.cables))S.cables=[];
if(!Array.isArray(S.homeruns))S.homeruns=[];
if(!Array.isArray(S.sites))S.sites=[];
if(!Array.isArray(S.power))S.power=[];
if(!S.settings||typeof S.settings!=='object')S.settings={};
var PORTS=[['24','24 ports'],['48','48 ports']];
var DEV_COLORS=[['','Default for kind'],['#2563eb','Blue'],['#0891b2','Cyan'],['#16a34a','Green'],['#65a30d','Lime'],
  ['#d97706','Orange'],['#dc2626','Red'],['#db2777','Pink'],['#7c3aed','Purple'],['#0f766e','Teal'],
  ['#475569','Slate'],['#78350f','Brown'],['#111827','Black'],['#9ca3af','Gray']];
var DEV_FALLBACK={switch:'#2563eb',patch:'#d97706',fiber:'#0d9488',router:'#7c3aed',firewall:'#dc2626',server:'#0f766e',ups:'#16a34a',pdu:'#475569',other:'#6b7280'};
// kind, display name, label abbreviation, default port/outlet count
var DEVICE_KINDS=[['switch','Switch','SW',24],['patch','Patch panel','PP',24],['fiber','Fiber panel','FP',12],['router','Router','RTR',8],['firewall','Firewall','FW',8],
  ['server','Server','SRV',4],['ups','UPS','UPS',6],['pdu','PDU','PDU',8],['other','Other device','DEV',0]];
var NUM_OPTS=[['','Top row first: 1–24 on the top row, 25–48 below (default)'],['zigzag','Odd ports on top, even on bottom (zig-zag)']];
var JACK_OPTS=[['','Not set (treated as fixed)'],['yes','Removable keystone jacks — can be moved'],['no','Fixed — cannot be moved']];
function kindRow(k){for(var i=0;i<DEVICE_KINDS.length;i++)if(DEVICE_KINDS[i][0]===k)return DEVICE_KINDS[i];return DEVICE_KINDS[0]}
function kindOpts(){return DEVICE_KINDS.map(function(k){return [k[0],k[1]]})}
function portsTxt(d){return d.portCount?d.portCount+(d.kind==='pdu'||d.kind==='ups'?' outlets':' ports'):(d.kind==='pdu'||d.kind==='ups'?'no outlets':'no ports')}
function deviceColor(d){return d.color||DEV_FALLBACK[d.kind]||'#2563eb'}
var APP_VERSION='3.3.1'; // bump on every revision; the delivered file is named closet-mapper-v<version>.html

var Q='"'; // double-quote char used when building the cable rows on the Labels tab
function siteFold(){var c={};(S.sites||[]).forEach(function(st,i){if(i>0)c[st.id]=true});return c}
var ui={real:(function(){try{return localStorage.getItem('closetMapperReal')!=='0'}catch(e){return true}})(),collapsed:siteFold(),view:'map',loc:null,rack:null,dev:null,q:'',zoom:null,showL:true,back:null,qrFail:false,
  lp:{what:'ports',rack:'all',size:'avery5160',qr:false,usedOnly:false,copies:1}};
var U=22;
function el(id){return document.getElementById(id)}
function uid(){return Math.random().toString(36).slice(2,10)}
// ---- saving, time stamps and auto-save to a backup file
var fs={h:null,name:'',state:'off',at:null,err:'',timer:null};
var FS_OK=('showSaveFilePicker' in window)&&window.isSecureContext;
function z2(n){return (n<10?'0':'')+n}
function stampName(d){d=d||new Date();return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate())+'_'+z2(d.getHours())+z2(d.getMinutes())}
function fmtTime(iso){try{return new Date(iso).toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}catch(e){return ''}}
// A cable takes the colour of the colour-coded port it is plugged into (patch panel end first).
function followColor(c){var a=byId(S.ports,c.a),b=byId(S.ports,c.b);if(!a||!b)return null;
  var cand=[[a,deviceOfPort(a)],[b,deviceOfPort(b)]];
  var pick=cand.filter(function(x){return x[0].color&&x[1]&&x[1].kind==='patch'||x[1].kind==='fiber'})[0]||cand.filter(function(x){return x[0].color})[0];
  return pick?pick[0]:null}
function syncCableColors(){var n=0;S.cables.forEach(function(c){var p=followColor(c);if(p&&c.color!==p.color){c.color=p.color;n++}});
  S.homeruns.forEach(function(h){var q=byId(S.ports,h.port);if(q&&q.color&&h.color!==q.color){h.color=q.color;n++}});return n}
// ---- undo / redo: every save keeps the state before it (up to 40 steps)
var undoS=[],redoS=[],lastSnap=null,UNDO_MAX=40;
function snapOf(){var t=S.savedAt,h=S.history;S.savedAt=null;S.history=undefined;var j=JSON.stringify(S);S.savedAt=t;S.history=h;return j}
function trackUndo(){var now=snapOf();if(lastSnap!==null&&now!==lastSnap){if(!trackUndo.quiet)try{logHistory(lastSnap)}catch(e){}undoS.push(lastSnap);if(undoS.length>UNDO_MAX)undoS.shift();redoS=[]}lastSnap=now;trackUndo.quiet=0;drawUndo()}
function drawUndo(){var u=el('bUndo'),r=el('bRedo');if(u)u.disabled=!undoS.length;if(r)r.disabled=!redoS.length}
function restoreSnap(j,why){var h=S.history;S=JSON.parse(j);S.history=h;lastSnap=j;applyPalette();try{logHistory(null,why)}catch(e){}
  if(ui.dev&&!byId(S.devices,ui.dev)){ui.dev=null;if(ui.view==='device')ui.view='map'}
  if(ui.rack&&!byId(S.racks,ui.rack))ui.rack=null;if(ui.loc&&!byId(S.locations,ui.loc))ui.loc=S.locations.length?S.locations[0].id:null;
  try{S.savedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  scheduleFileWrite();drawUndo();render()}
function undo(){if(!undoS.length){toast('Nothing to undo.');return}redoS.push(snapOf());restoreSnap(undoS.pop(),'Undo');toast('Undone')}
function redo(){if(!redoS.length){toast('Nothing to redo.');return}undoS.push(snapOf());restoreSnap(redoS.pop(),'Redo');toast('Redone')}
function save(){
  if(viewOnly()){var hh=S.history;try{S=JSON.parse(lastSnap)}catch(e){}S.history=hh;toast('You have view-only access to this team’s map.',1);return}
  try{syncCableColors();trackUndo();S.savedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(S))}
  catch(e){alert('Could not save — browser storage may be full or blocked.')}
  if(cloudOn()&&CS.team){if(lastSnap!==save._last){save._last=lastSnap;cloudChanged()}}else scheduleFileWrite()}
function stamped(extra){var now=new Date().toISOString(),o=Object.assign({},S,{savedAt:S.savedAt||now},extra?{exportedAt:now}:{});delete o.lock;if(!extra&&fs.h)o.lock=myLock();var pd=photoDataFor();if(pd)o.photoData=pd;return JSON.stringify(o,null,1)}
function exportText(){return stamped(true)}
function idbOpen(){return new Promise(function(res,rej){var q=indexedDB.open('closetMapperFS',1);
  q.onupgradeneeded=function(){q.result.createObjectStore('h')};q.onerror=function(){rej(q.error)};q.onsuccess=function(){res(q.result)}})}
function idbPut(h){return idbOpen().then(function(db){return new Promise(function(res,rej){var t=db.transaction('h','readwrite');
  if(h)t.objectStore('h').put(h,'file');else t.objectStore('h').delete('file');t.oncomplete=function(){db.close();res()};t.onerror=function(){db.close();rej(t.error)}})})}
function idbGet(){return idbOpen().then(function(db){return new Promise(function(res,rej){var r=db.transaction('h').objectStore('h').get('file');
  r.onsuccess=function(){db.close();res(r.result)};r.onerror=function(){db.close();rej(r.error)}})})}

// ---- one device at a time: the backup file carries a lock that is refreshed every 30 s; a second copy of the app sees it and stays out
var SID=uid(),LOCK_MS=90000,lastFileJ=null;
function myLock(){return {id:SID,at:new Date().toISOString(),who:(navigator.userAgentData&&navigator.userAgentData.platform)||navigator.platform||'another device'}}
function foreignLock(j){var k=j&&j.lock;return k&&k.id&&k.id!==SID&&Date.now()-Date.parse(k.at)<LOCK_MS?k:null}
function readFileJ(){return fs.h.getFile().then(function(f){return f.text()}).then(function(t){try{return JSON.parse(t)}catch(e){return null}})}
function showLocked(k,j){
  fs.state='locked';lastFileJ=j||lastFileJ;clearTimeout(fs.timer);drawBackup();
  var so=el('startov');if(so)so.remove();
  var o=el('lockov');if(!o){o=document.createElement('div');o.id='lockov';o.className='ovl';o.style.zIndex='60';document.body.appendChild(o)}
  o.innerHTML='<div class="dlg"><h2 style="margin:0 0 8px">Closet Mapper is already open somewhere else</h2>'+
    '<p>The file <b>'+esc(fs.name)+'</b> is in use by another device ('+esc(k&&k.who||'unknown')+', last active '+esc(k?fmtTime(k.at):'')+'). Editing here too would create a second copy of your data, so this window is paused.</p>'+
    '<p class="muted">Close the app on the other device, wait a minute and press Check again — or take over if that device is no longer in use.</p>'+
    '<div class="row" style="margin-top:14px"><button class="pri" id="lkRe">Check again</button><button id="lkLoad">Take over &amp; load the file’s data</button><button id="lkKeep">Take over &amp; keep this browser’s data</button></div></div>';
  el('lkRe').onclick=function(){hideLocked();fs.state='on';syncWithFile(true)};
  el('lkLoad').onclick=function(){var j=lastFileJ;if(j&&Array.isArray(j.locations)){loadFileJ(j)}hideLocked();fs.state='on';writeNow(true)};
  el('lkKeep').onclick=function(){hideLocked();fs.state='on';writeNow(true)}}
function hideLocked(){var o=el('lockov');if(o)o.remove()}
function loadFileJ(j){if(!Array.isArray(j.ports))j.ports=[];if(!Array.isArray(j.cables))j.cables=[];if(!Array.isArray(j.homeruns))j.homeruns=[];if(!Array.isArray(j.sites))j.sites=[];if(!Array.isArray(j.power))j.power=[];if(!j.settings)j.settings={};
  absorbPhotos(j);delete j.exportedAt;delete j.lock;S=j;trackUndo.quiet=1;ui.loc=S.locations.length?S.locations[0].id:null;ui.rack=null;ui.dev=null;ui.view='map';ui.zoom=null;ui.collapsed=siteFold();fs.at=S.savedAt;commit()}
setInterval(function(){if(!fs.h||fs.state!=='on')return;readFileJ().then(function(j){var k=foreignLock(j);if(k)showLocked(k,j);else writeNow(true)}).catch(function(){})},30000);
function scheduleFileWrite(){if(!fs.h)return;clearTimeout(fs.timer);fs.timer=setTimeout(writeNow,500)}
function writeNow(force){
  if(!fs.h||fs.state==='locked')return Promise.resolve();
  return fs.h.queryPermission({mode:'readwrite'}).then(function(pm){
    if(pm!=='granted'){fs.state='perm';drawBackup();return}
    return (force===true?Promise.resolve(null):readFileJ()).then(function(j){var k=foreignLock(j);if(k){showLocked(k,j);return 'locked'}
    return fs.h.createWritable().then(function(w){return w.write(stamped(false)).then(function(){return w.close()})})
      .then(function(){fs.state='on';fs.at=S.savedAt||new Date().toISOString();fs.err='';drawBackup()})})
  }).catch(function(e){fs.state='err';fs.err=String(e&&e.message?e.message:e);drawBackup()})}
// Before the first write, never overwrite a newer backup with an older or empty copy.
function syncWithFile(writeAfter){
  return fs.h.getFile().then(function(f){return f.text()}).then(function(txt){
    var j=null;try{j=JSON.parse(txt)}catch(x){}
    var fl=foreignLock(j);if(fl){showLocked(fl,j);return}
    if(j&&Array.isArray(j.locations)&&Array.isArray(j.racks)&&Array.isArray(j.devices)){
      var empty=!S.locations.length&&!S.devices.length,newer=j.savedAt&&(!S.savedAt||j.savedAt>S.savedAt);
      if((empty||newer)&&confirm('The file "'+fs.name+'" already holds a backup'+(j.savedAt?' from '+fmtTime(j.savedAt):'')+
        (empty?' and this browser is empty.':' that is newer than what is in this browser.')+
        '\n\nOK = load that backup into the app (the file stays as it is).\nCancel = keep what is here and overwrite the file.')){
        if(!Array.isArray(j.ports))j.ports=[];if(!Array.isArray(j.cables))j.cables=[];if(!Array.isArray(j.homeruns))j.homeruns=[];if(!Array.isArray(j.sites))j.sites=[];if(!Array.isArray(j.power))j.power=[];if(!j.settings)j.settings={};
        absorbPhotos(j);delete j.exportedAt;delete j.lock;S=j;trackUndo.quiet=1;ui.loc=S.locations.length?S.locations[0].id:null;ui.rack=null;ui.dev=null;ui.view='map';ui.zoom=null;ui.collapsed=siteFold();
        fs.state='on';fs.at=S.savedAt;commit();return}}
    if(writeAfter)return writeNow();
  }).catch(function(){if(writeAfter)return writeNow()})}
function linkFile(){
  window.showSaveFilePicker({suggestedName:'closet-backup.json',types:[{description:'Closet Mapper backup',accept:{'application/json':['.json']}}]})
  .then(function(h){fs.h=h;fs.name=h.name;fs.state='on';idbPut(h).catch(function(){});return syncWithFile(true)})
  .catch(function(e){if(e&&e.name==='AbortError')return;fs.state='err';fs.err=String(e&&e.message?e.message:e);drawBackup()})}
function reconnectFile(){
  fs.h.requestPermission({mode:'readwrite'}).then(function(pm){if(pm==='granted'){fs.state='on';return syncWithFile(true)}})
  .catch(function(e){fs.state='err';fs.err=String(e&&e.message?e.message:e);drawBackup()})}
function unlinkFile(){if(!confirm('Stop auto-saving to "'+fs.name+'"? The file keeps its last saved contents.'))return;
  fs.h=null;fs.name='';fs.state='off';idbPut(null).catch(function(){});drawBackup()}
function drawBackup(){var b=el('bkp');if(!b)return;if(cloudOn())return drawCloud(b);
  var h='',st=fs.state,link=function(t,id){return '<button id="'+id+'" style="margin-top:7px;width:100%">'+t+'</button>'};
  if(!FS_OK)h='<div><span class="led warn"></span>Saved in this browser only</div><p class="muted" style="font-size:12px;margin:4px 0 0">Auto-save to a file needs Chrome or Edge. Use File ▸ Export to keep a copy.</p>';
  else if(!fs.h)h='<div><span class="led warn"></span>No backup file</div>'+link('Auto-save to a file…','fsLink');
  else if(st==='perm')h='<div><span class="led warn"></span>'+esc(fs.name)+' — paused</div>'+link('Reconnect','fsRe');
  else if(st==='locked')h='<div><span class="led bad"></span>Open on another device</div>';
  else if(st==='err')h='<div><span class="led bad"></span>Could not write '+esc(fs.name)+'</div><div class="muted" style="font-size:12px">'+esc(fs.err)+'</div><div class="row"><button id="fsRe">Try again</button><button id="fsOff">Stop</button></div>';
  else h='<div title="Every change is written to this file"><span class="led on"></span>'+esc(fs.name)+'</div><div class="muted" style="font-size:12px;margin-top:2px">Saved '+(fs.at?esc(fmtTime(fs.at)):'')+' · <a id="fsOff" href="#" style="color:var(--muted)">stop</a></div>';
  b.innerHTML=h;
  if(el('fsLink'))el('fsLink').onclick=linkFile;if(el('fsRe'))el('fsRe').onclick=reconnectFile;if(el('fsOff'))el('fsOff').onclick=function(e){e.preventDefault();unlinkFile()}}
function commit(){save();render()}
function byId(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function deviceOfPort(p){return byId(S.devices,p.devId)}

function locOfRack(r){return byId(S.locations,r.locId)}
function dn(d){return d?(d.label||d.name):'(unknown device)'}
function pn(p){var d=p?deviceOfPort(p):null;return p?(dn(d)+'-'+p.num):'(unknown port)'}
function powerOf(pid){for(var i=0;i<S.power.length;i++)if(S.power[i].port===pid)return S.power[i];return null}
function homerunOf(pid){for(var i=0;i<S.homeruns.length;i++)if(S.homeruns[i].port===pid)return S.homeruns[i];return null}

function trunkOf(pid){for(var i=0;i<S.cables.length;i++){var c=S.cables[i];if(c.trunk&&(c.a===pid||c.b===pid))return c}return null}

function cn(c){if(!c)return '';if(c.label)return c.label;var a=byId(S.ports,c.a),b=byId(S.ports,c.b);return pn(a)+' ↔ '+pn(b)}

function modal(title,fields,ok,after){
  var h='<h3 style="margin-top:0">'+esc(title)+'</h3>',i;
  for(i=0;i<fields.length;i++){var f=fields[i];
    h+='<label>'+esc(f.label)+'</label>';
    if(f.options){h+='<select id="f'+i+'">';
      for(var j=0;j<f.options.length;j++){var o=f.options[j];
        h+='<option value="'+esc(o[0])+'"'+(o[0]===f.value?' selected':'')+'>'+esc(o[1])+'</option>'}
      h+='</select>'}
    else h+='<input id="f'+i+'" type="'+esc(f.type||'text')+'" value="'+esc(f.value==null?'':f.value)+'">'}
  h+='<div class="row" style="margin-top:12px"><button class="pri" id="mok">OK</button><button id="mno">Cancel</button></div>';
  var box=el('mbox');box.innerHTML=h;el('modal').style.display='flex';
  function close(){el('modal').style.display='none';box.onkeydown=null}
  function go(){var v=[],k;for(k=0;k<fields.length;k++)v.push(el('f'+k).value);
    var r=ok?ok(v):undefined;if(r!==false)close()}
  el('mok').onclick=go;el('mno').onclick=close;
  box.onkeydown=function(e){if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA')go();if(e.key==='Escape')close()};
  if(after)after();

}

function locLoad(l){var rs=S.racks.filter(function(r){return r.locId===l.id}),ids={};rs.forEach(function(r){ids[r.id]=1});return {l:l,r:rs.length,d:S.devices.filter(function(d){return ids[d.rackId]}).length}}
function delSite(st){var ls=S.locations.filter(function(l){return l.siteId===st.id}),busy=ls.map(locLoad).filter(function(x){return x.r||x.d});

  others.sort(function(a,b){return ((rackOfDevice(a).locId!==srcLoc)?0:1)-((rackOfDevice(b).locId!==srcLoc)?0:1)});
  modal('Connect strands from '+dn(d)+' to another fiber panel',[
    {label:'This panel — first port',type:'number',value:1},
    {label:'Other fiber panel (in the other closet)',options:others.map(function(x){return [x.id,devWhere(x)]})},
    {label:'Other panel — first port',type:'number',value:1},
    {label:'How many strands / ports',type:'number',value:Math.min(12,d.portCount||12)},

  var prefix=kind==='patch'?'Patch Panel ':kind==='switch'?'Switch ':kind==='fiber'?'Fiber Panel ':kN(kind)+' ',max=0,same=S.devices.filter(function(x){return x.rackId===rackId&&x.kind===kind});

function importCables(){
  var racks=S.racks.slice();
  if(!racks.length){toast('Add a rack and some devices first.',1);return}
  modal('Paste a cable list',[{label:'Rack',options:racks.map(function(r){return [r.id,locFull(locOfRack(r))+' / '+r.name]})},
   {label:'One cable per line: "PanelPort, SwitchPort[, CableLabel]". A header row is ignored.',value:''}],function(v){
    var devs=S.devices.filter(function(d){return d.rackId===v[0]});
    var pp=devs.filter(function(d){return d.kind==='patch'})[0],sw=devs.filter(function(d){return d.kind==='switch'})[0];
    if(!pp||!sw){toast('That rack needs a patch panel and a switch.',1);return false}
    var pnl=portsOf(pp.id),swp=portsOf(sw.id),made=0,bad=[];
    v[1].split(/\r?\n/).forEach(function(line){
      line=line.trim();if(!line)return;
      var c=line.split(/[,\t;]/).map(function(x){return x.trim()});
      var an=parseInt(String(c[0]).replace(/[^\d]/g,''),10),bn=parseInt(String(c[1]).replace(/[^\d]/g,''),10);
      if(!(an&&bn)){bad.push(line);return}
      var A=pnl.filter(function(p){return p.num===an})[0],B=swp.filter(function(p){return p.num===bn})[0];
      if(!A||!B||cableOf(A.id)||cableOf(B.id)||homerunOf(A.id)||homerunOf(B.id)||powerOf(A.id)||powerOf(B.id)){bad.push(line);return}
      S.cables.push({id:uid(),a:A.id,b:B.id,label:c[2]||''});made++});
    commit();toast(made+' cable'+(made===1?'':'s')+' imported.'+(bad.length?' '+bad.length+' line'+(bad.length===1?'':'s')+' skipped.':''),bad.length&&!made)})}

function importDevices(){
  if(!ui.loc){toast('Pick a location first.',1);return}
  var racks=S.racks.filter(function(r){return r.locId===ui.loc});
  if(!racks.length){toast('Add a rack first.',1);return}
  modal('Paste a device list',[{label:'Rack',options:racks.map(function(r){return [r.id,r.name]})},
   {label:'One device per line: "switch, Name, 24 or 48, height" or "patch, Name, 24 or 48"',value:''}],function(v){
    var r=byId(S.racks,v[0]),made=0,bad=[];
    v[1].split(/\r?\n/).forEach(function(line){
      line=line.trim();if(!line)return;
      var c=line.split(/[,\t;]/).map(function(x){return x.trim()});
      var kind=/^(sw|switch)/i.test(c[0])?'switch':(/^(pp|patch|panel)/i.test(c[0])?'patch':(/\.*/.test(c[0])&&false?null:'switch'));
      var pc=parseInt(c[2],10),hu=parseInt(c[3],10)||1;
      if(!kind||!c[1]||(pc!==24&&pc!==48)){bad.push(line+' (port count must be 24 or 48)');return}
      var u=suggestU(r.id,hu);
      if(!fits(r.id,u,hu)){bad.push(line+' (no space)');return}
      var d={id:uid(),rackId:r.id,kind:kind,name:c[1],label:'',portCount:pc,startU:u,heightU:hu};
      S.devices.push(d);for(var n=1;n<=pc;n++)S.ports.push({id:uid(),devId:d.id,num:n,label:''});made++});
    commit();toast(made+' device'+(made===1?'':'s')+' added.'+(bad.length?' '+bad.length+' line'+(bad.length===1?'':'s')+' skipped.':''),bad.length&&!made)})}

function fillBlanks(scope,overwrite){
  var n=0;

    if(overwrite||!d.label){d.label=fillTpl(setting('devTpl'),d);n++}
    portsOf(d.id).forEach(function(p){if(overwrite||!p.label){p.label=fillTpl(setting('portTpl'),d,p);n++}})});
  commit();toast(n+' label'+(n===1?'':'s')+' '+(overwrite?'rewritten':'filled')+'.')}

function cleanDoc(j){var o=Object.assign({},j);delete o.photoData;delete o.lock;delete o.exportedAt;return o}

function normDoc(j){j=j||{};['locations','racks','devices','ports','cables','homeruns','sites','power'].forEach(function(k){if(!Array.isArray(j[k]))j[k]=[]});if(!j.settings||typeof j.settings!=='object')j.settings={};delete j.photoData;delete j.lock;delete j.exportedAt;return j}

function applyRemote(d,v,keepUi){var prev={loc:ui.loc,rack:ui.rack,dev:ui.dev,view:ui.view};S=normDoc(d);CS.base=JSON.stringify(cleanDoc(S));CS.version=v;CS.gen=0;CS.pushedGen=0;CS.loaded=true;
  trackUndo.quiet=1;lastSnap=snapOf();save._last=lastSnap;trackUndo.quiet=0;if(!keepUi){undoS=[];redoS=[]}drawUndo();applyPalette();
  if(keepUi&&prev.loc&&byId(S.locations,prev.loc)){ui.loc=prev.loc;ui.rack=prev.rack&&byId(S.racks,prev.rack)?prev.rack:null;ui.dev=prev.dev&&byId(S.devices,prev.dev)?prev.dev:null;if(ui.view==='device'&&!ui.dev)ui.view='map'}
  else{ui.loc=S.locations.length?S.locations[0].id:null;ui.rack=null;ui.dev=null;ui.view='map';ui.collapsed=siteFold()}
  try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem('cmVer:'+CS.team.id,String(v))}catch(e){}

// ---- saving: whole document, only if nobody saved in between (version check)
function cloudChanged(){CS.gen++;clearTimeout(CS.timer);CS.timer=setTimeout(cloudPush,1200);cloudStatus('pending')}
function cloudPush(){if(!CS.team||!CS.loaded)return;if(CS.saving){clearTimeout(CS.timer);CS.timer=setTimeout(cloudPush,800);return}
  if(CS.gen===CS.pushedGen){cloudStatus('saved');return}
  var g=CS.gen,doc=cleanDoc(S);CS.saving=true;cloudStatus('saving');
  SB.rpc('save_map',{t:CS.team.id,d:doc,expected:CS.version}).then(function(r){CS.saving=false;
    if(r.error)throw r.error;
    if(r.data===-1)return cloudMerge();
    CS.version=r.data;CS.pushedGen=g;CS.base=JSON.stringify(doc);CS.merges=0;try{localStorage.setItem('cmVer:'+CS.team.id,String(r.data))}catch(e){}
    if(CS.gen!==g)cloudPush();else cloudStatus('saved')}).catch(function(e){CS.saving=false;cloudStatus(navigator.onLine===false?'offline':'error',String(e.message||e));
      clearTimeout(CS.retry);CS.retry=setTimeout(cloudPush,15000)})}
// someone saved first: fold their changes into yours and save again (the dialog is only a last resort)
function cloudMerge(){CS.merges=(CS.merges||0)+1;if(CS.merges>3)return cloudConflict();cloudStatus('saving');
  SB.from('maps').select('data,version').eq('team_id',CS.team.id).single().then(function(r){if(r.error||!r.data)throw r.error||new Error('no map');
    var base=null;try{base=JSON.parse(CS.base||'{}')}catch(e){base={}}
    var merged=normDoc(merge3(base,cleanDoc(S),normDoc(r.data.data)));var h=S.history;S=merged;if(!S.history)S.history=h;
    CS.base=JSON.stringify(cleanDoc(normDoc(r.data.data)));CS.version=r.data.version;
    trackUndo.quiet=1;lastSnap=snapOf();save._last=lastSnap;trackUndo.quiet=0;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    render();toast('Merged your changes with a teammate’s.');cloudPush()}).catch(function(e){cloudErr(e)})}

// ---- three-way merge: your edits and a teammate's edits since the last sync both survive;
// only when you both changed the same field of the same thing does yours win
function eqJ(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function merge3(base,mine,theirs){base=base||{};var out={},keys={};[base,mine,theirs].forEach(function(o){Object.keys(o||{}).forEach(function(k){keys[k]=1})});
  Object.keys(keys).forEach(function(k){var b=base[k],m=mine[k],t=theirs[k];
    if(k==='history'){var all=(t||[]).concat(m||[]),seen={},h=[];all.forEach(function(e){var key=e.at+'|'+(e.items||[]).join();if(!seen[key]){seen[key]=1;h.push(e)}});h.sort(function(x,y){return x.at<y.at?1:-1});out[k]=h.slice(0,HIST_MAX);return}
    if(Array.isArray(m)&&Array.isArray(t)&&(m.concat(t).every(function(x){return x&&typeof x==='object'&&x.id!=null}))){out[k]=mergeById(b||[],m,t);return}
    if(m&&t&&typeof m==='object'&&typeof t==='object'&&!Array.isArray(m)&&!Array.isArray(t)&&k!=='settings'){out[k]=merge3(b&&typeof b==='object'?b:{},m,t);return}
    out[k]=eqJ(m,b)?t:m});
  Object.keys(out).forEach(function(k){if(out[k]===undefined)delete out[k]});return out}
function mergeById(b,m,t){var B={},M={},T={},res=[],done={};b.forEach(function(x){B[x.id]=x});m.forEach(function(x){M[x.id]=x});t.forEach(function(x){T[x.id]=x});
  function one(id){var bb=B[id],mm=M[id],tt=T[id];
    if(mm&&tt){if(!bb)return eqJ(mm,tt)?tt:mm;var o={},ks={};[bb,mm,tt].forEach(function(x){Object.keys(x).forEach(function(k){ks[k]=1})});
      Object.keys(ks).forEach(function(k){var v=eqJ(mm[k],bb[k])?tt[k]:mm[k];if(v!==undefined)o[k]=v});return o}
    if(mm&&!tt)return bb?(eqJ(mm,bb)?null:mm):mm;   // they deleted it: gone, unless you changed it
    if(tt&&!mm)return bb?(eqJ(tt,bb)?null:tt):tt;   // you deleted it: gone, unless they changed it
    return null}
  t.concat(m).forEach(function(x){if(done[x.id])return;done[x.id]=1;var r=one(x.id);if(r)res.push(r)});return res}

    it.forEach(function(x){var b=document.createElement('div');b.className='mi';b.textContent=x[0];b.onclick=function(){closeCtx();x[1]()};mm.appendChild(b)});
    document.body.appendChild(mm);ctxEl=mm;mm.style.left=Math.min(ev.clientX,innerWidth-260)+'px';mm.style.top=Math.min(ev.clientY,innerHeight-mm.offsetHeight-8)+'px';
  }}
// ---------- Global search ----------
var gs={res:[],sel:0};
function gsNorm(t){return String(t==null?'':t).toLowerCase()}
function gsHL(text,toks){var t=String(text),out='',low=t.toLowerCase(),i=0;
  while(i<t.length){var best=-1,bl=0;
    for(var k=0;k<toks.length;k++){var j=low.indexOf(toks[k],i);if(j>=0&&(best<0||j<best||(j===best&&toks[k].length>bl))){best=j;bl=toks[k].length}}
    if(best<0){out+=esc(t.slice(i));break}
    out+=esc(t.slice(i,best))+'<mark>'+esc(t.slice(best,best+bl))+'</mark>';i=best+bl}
  return out}
function gsMatch(fields,toks){
  var hay=gsNorm(fields.join(' | ')),flat=hay.replace(/[^a-z0-9]/g,'');
  for(var i=0;i<toks.length;i++){var t=toks[i];
    if(hay.indexOf(t)<0){var tf=t.replace(/[^a-z0-9]/g,'');if(!tf||flat.indexOf(tf)<0)return false}}
  return true}
function gsSearch(q){
  var toks=gsNorm(q).split(/\s+/).filter(Boolean),out=[];if(!toks.length)return {toks:toks,res:out};
  var LIM=8,n;
  n=0;S.locations.forEach(function(l){if(n<LIM&&gsMatch([l.name,l.label,siteOf(l)?siteOf(l).name:''],toks)){n++;
    out.push({g:'Locations',t:locFull(l)+(l.label?' — '+l.label:''),s:S.racks.filter(function(r){return r.locId===l.id}).length+' rack(s)',go:function(){ui.loc=l.id;ui.view='map';render()}})}});
  n=0;S.racks.forEach(function(r){var l=locOfRack(r);if(n<LIM&&gsMatch([r.name,r.label,l?locFull(l):''],toks)){n++;
    out.push({g:'Racks',t:r.name+(r.label?' — '+r.label:''),s:(l?locFull(l):'')+' · '+r.height+'U',go:function(){ui.rack=r.id;ui.loc=r.locId;ui.zoom=null;ui.view='rack';render()}})}});
  n=0;S.devices.forEach(function(d){var r=rackOfDevice(d),l=r?locOfRack(r):null;
    if(n<LIM&&gsMatch([d.name,d.label,d.model,d.mac,d.fw,d.vlan,d.mgmt,d.notes,d.warranty,kN(d.kind)],toks)){n++;
      var hit=['model','mac','vlan','mgmt','notes'].filter(function(k){return d[k]&&gsMatch([d[k]],toks)&&!gsMatch([d.name,d.label],toks)})[0];
      out.push({g:'Devices',t:dn(d),s:kN(d.kind)+' · '+(l?locFull(l)+' / ':'')+(r?r.name:'')+' · U'+d.startU+(hit?' · '+hit+': '+String(d[hit]).slice(0,40):''),
        go:function(){if(r){ui.rack=r.id;ui.loc=r.locId}ui.dev=d.id;ui.back='map';ui.view='device';render()}})}});
  n=0;S.ports.forEach(function(p){if(n>=LIM)return;var d=deviceOfPort(p);if(!d)return;var c=cableOf(p.id),hr=homerunOf(p.id);
    if(gsMatch([p.label,portCode(p)?portCode(p)[1]+' '+portCode(p)[2]:'',dn(d)+'-'+p.num,dn(d)+' '+p.num,d.name+'-'+p.num,d.name+'-'+pad2(p.num),c?cn(c):'',hr?'homerun '+hr.label:''],toks)&&(p.label||p.color||c||hr||toks.some(function(t){return /\d/.test(t)}))){n++;
      out.push({g:'Ports',t:pn(p)+(p.label?' — '+p.label:''),s:(portCode(p)?portCode(p)[2]+' · ':'')+(c?'cable: '+cn(c):hr?'homerun: '+(hr.label||''):powerOf(p.id)?'powers '+dn(byId(S.devices,powerOf(p.id).dev)||{name:'?'}):'not connected'),
        go:function(){var r=rackOfDevice(d);if(r){ui.rack=r.id;ui.loc=r.locId}ui.dev=d.id;ui.back='map';ui.view='device';render();editPort(p.id)}})}});
  n=0;S.homeruns.forEach(function(h){var q=byId(S.ports,h.port),d=q&&deviceOfPort(q);
    if(n<LIM&&d&&gsMatch([h.label,h.notes,cablePurpose(h),'homerun',pn(q)],toks)){n++;
      out.push({g:'Homeruns',t:(h.label||'Homerun')+' → '+pn(q),s:(cablePurpose(h)||'')+'',go:function(){var r=rackOfDevice(d);if(r){ui.rack=r.id;ui.loc=r.locId}ui.dev=d.id;ui.back='map';ui.view='device';render();editHomerun(h)}})}});
  n=0;S.cables.forEach(function(c){if(n<LIM&&gsMatch([c.label,c.notes,cn(c),cablePurpose(c)],toks)){n++;
    out.push({g:'Cables',t:cn(c),s:(c.notes||cablePurpose(c)||'')+'',go:function(){editCable(c)}})}});
  return {toks:toks,res:out}}
function gsDraw(){
  var box=el('gsr'),q=el('gsq').value,r=gsSearch(q);gs.res=r.res;if(gs.sel>=gs.res.length)gs.sel=0;
  if(!r.toks.length){box.style.display='none';return}
  var h='',last='';
  if(!r.res.length)h='<div class="gn">No matches for “'+esc(q)+'”.</div>';
  r.res.forEach(function(x,i){
    if(x.g!==last){h+='<div class="gh">'+x.g+'</div>';last=x.g}
    h+='<div class="gi'+(i===gs.sel?' sel':'')+'" data-i="'+i+'">'+gsHL(x.t,r.toks)+(x.s?'<small>'+esc(x.s)+'</small>':'')+'</div>'});
  box.innerHTML=h;box.style.display='block';
  box.querySelectorAll('.gi').forEach(function(e){
    e.onmousedown=function(ev){ev.preventDefault();gsPick(+e.getAttribute('data-i'))}})}
function gsClose(){el('gsr').style.display='none'}
function gsPick(i){var x=gs.res[i];if(!x)return;gsClose();el('gsq').value='';el('gsq').blur();
  if(location.hash)try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  x.go()}
el('gsq').oninput=function(){gs.sel=0;gsDraw()};
el('gsq').onfocus=function(){if(el('gsq').value)gsDraw()};
el('gsq').onblur=function(){setTimeout(gsClose,120)};
el('gsq').onkeydown=function(e){
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!gs.res.length)return;
    gs.sel=(gs.sel+(e.key==='ArrowDown'?1:gs.res.length-1))%gs.res.length;gsDraw();
    var s=el('gsr').querySelector('.gi.sel');if(s&&s.scrollIntoView)s.scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){e.preventDefault();gsPick(gs.sel)}
  else if(e.key==='Escape'){el('gsq').value='';gsClose();el('gsq').blur()}};
document.addEventListener('keydown',function(e){
  var t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
  if(((e.key==='k'||e.key==='K')&&(e.ctrlKey||e.metaKey))||(e.key==='/'&&!typing&&!e.ctrlKey&&!e.metaKey&&el('modal').style.display!=='flex')){
    e.preventDefault();el('gsq').focus();el('gsq').select()}});


ui.loc=S.locations.length?S.locations[0].id:null;
openFromHash();
render();
}
boot();
